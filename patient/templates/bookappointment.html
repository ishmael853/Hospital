<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | MediCare Hospital</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f0f5fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #0d6efd;
        }

        .navbar-brand {
            font-weight: bold;
            color: white;
        }

        .booking-card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .booking-header {
            background: linear-gradient(135deg, #0d6efd, #00b4d8);
            color: white;
            padding: 30px;
        }

        .form-control, .form-select {
            padding: 12px;
            border-radius: 10px;
        }

        .btn-book {
            background: #0d6efd;
            color: white;
            border-radius: 10px;
            padding: 13px;
            font-weight: bold;
        }

        .btn-book:hover {
            background: #084298;
            color: white;
        }

        footer {
            background: #0b1f33;
            color: white;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="#">MediCare Hospital</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="#">Appointments</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/profile/">Profile</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card booking-card">

                <div class="booking-header">
                    <h2 class="fw-bold">Book an Appointment</h2>
                    <p class="mb-0">
                        Schedule your visit with our professional medical team.
                    </p>
                </div>

                <div class="card-body p-4 p-md-5">

                    <form method="POST">
                        {% csrf_token %}

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">
                                    Full Name
                                </label>

                                <input type="text"
                                       name="patient_name"
                                       class="form-control"
                                       placeholder="Enter your full name"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">
                                    Email Address
                                </label>

                                <input type="email"
                                       name="email"
                                       class="form-control"
                                       placeholder="Enter your email"
                                       required>
                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Phone Number
                            </label>

                            <input type="tel"
                                   name="phone"
                                   class="form-control"
                                   placeholder="+254 7XX XXX XXX"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Medical Department
                            </label>

                            <select name="department"
                                    class="form-select"
                                    required>

                                <option value="">Select Department</option>
                                <option>General Medicine</option>
                                <option>Cardiology</option>
                                <option>Dental</option>
                                <option>Neurology</option>
                                <option>Pediatrics</option>
                                <option>Orthopedics</option>
                                <option>Dermatology</option>
                                <option>Gynecology</option>
                                <option>Ophthalmology</option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Select Doctor
                            </label>

                            <select name="doctor"
                                    class="form-select"
                                    required>

                                <option value="">Choose Doctor</option>
                                <option>Dr. John Smith</option>
                                <option>Dr. Sarah Johnson</option>
                                <option>Dr. Michael Brown</option>
                                <option>Dr. Emily Davis</option>

                            </select>
                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">
                                    Appointment Date
                                </label>

                                <input type="date"
                                       name="appointment_date"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">
                                    Appointment Time
                                </label>

                                <input type="time"
                                       name="appointment_time"
                                       class="form-control"
                                       required>
                            </div>

                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Reason for Appointment
                            </label>

                            <textarea name="reason"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Describe your reason for booking..."
                                      required></textarea>
                        </div>

                        <button type="submit"
                                class="btn btn-book w-100">
                            Book Appointment
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

<footer class="text-center">
    <p class="mb-0">
        &copy; 2026 MediCare Hospital. All Rights Reserved.
    </p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
